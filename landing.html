  <script>
    function createParticles() {
      const container = document.querySelector('.growth-particles');
      const name = document.querySelector('.name');
      const rect = name.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const rings = 3;
      const particlesPerRing = 40;
      for (let ring = 0; ring < rings; ring++) {
        for (let i = 0; i < particlesPerRing; i++) {
          const particle = document.createElement('div');
          particle.className = 'particle';
          const size = Math.random() * 6 + 2;
          particle.style.width = `${size}px`;
          particle.style.height = `${size}px`;
          const angle = (i / particlesPerRing) * Math.PI * 2;
          const radius = (Math.min(rect.width, rect.height) / 2) * (ring + 1);
          const x = centerX + Math.cos(angle) * radius;
          const y = centerY + Math.sin(angle) * radius;
          const startX = Math.random() * window.innerWidth;
          const startY = Math.random() * window.innerHeight;
          particle.style.left = `${startX}px`;
          particle.style.top = `${startY}px`;
          container.appendChild(particle);
        }
      }
    }
    function animateParticles() {
      const particles = document.querySelectorAll('.particle');
      particles.forEach((particle, index) => {
        setTimeout(() => {
          particle.classList.add('active');
          const name = document.querySelector('.name');
          const rect = name.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;
          const angle = (index % 40) * (Math.PI * 2 / 40);
          const radius = (Math.min(rect.width, rect.height) / 2) * (Math.floor(index / 40) + 1);
          const targetX = centerX + Math.cos(angle) * radius;
          const targetY = centerY + Math.sin(angle) * radius;
          const rotation = Math.random() * 360;
          particle.style.transform = `translate(${targetX - parseFloat(particle.style.left)}px, ${targetY - parseFloat(particle.style.top)}px) rotate(${rotation}deg)`;
          setTimeout(() => {
            particle.classList.add('growing');
          }, 100);
        }, index * 0.5);
      });
    }
    function transitionToHome(event) {
      event.preventDefault();
      createParticles();
      animateParticles();
      document.querySelector('.transition-overlay').classList.add('active');
      setTimeout(() => {
        window.location.href = 'Computational Design.html';
      }, 1000);
    }

    // Animate name-rule on load
    setTimeout(() => {
      const rule = document.getElementById('name-rule');
      if (rule) rule.style.width = '100%';
    }, 500);
  </script>

  <!-- Gooey text morphing animation -->
  <script>
    (function() {
      var texts = [
        'Architect',
        'Computational Designer',
        'Spatial Artist',
        'Design Technologist',
        'Researcher'
      ];

      var MORPH_TIME    = 1.2;   // seconds per morph
      var COOLDOWN_TIME = 1.8;   // seconds held still between morphs

      var elA = document.getElementById('gooey-a');
      var elB = document.getElementById('gooey-b');

      if (!elA || !elB) return;

      var textIndex = texts.length - 1;
      var morph     = 0;
      var cooldown  = COOLDOWN_TIME;
      var lastTime  = performance.now();

      elA.textContent = texts[textIndex % texts.length];
      elB.textContent = texts[(textIndex + 1) % texts.length];

      function setMorph(fraction) {
        // elB fades in (fraction 0→1)
        var blurB = Math.min(8 / fraction - 8, 100);
        elB.style.filter  = 'blur(' + blurB + 'px)';
        elB.style.opacity = Math.pow(fraction, 0.4);

        // elA fades out (fraction 0→1 means elA goes 1→0)
        var inv  = 1 - fraction;
        var blurA = Math.min(8 / inv - 8, 100);
        elA.style.filter  = 'blur(' + blurA + 'px)';
        elA.style.opacity = Math.pow(inv, 0.4);
      }

      function doCooldown() {
        morph = 0;
        elB.style.filter  = '';
        elB.style.opacity = '1';
        elA.style.filter  = '';
        elA.style.opacity = '0';
      }

      function animate(now) {
        requestAnimationFrame(animate);
        var dt = Math.min((now - lastTime) / 1000, 0.1); // cap at 100ms
        lastTime = now;

        var wasCooling = cooldown > 0;
        cooldown -= dt;

        if (cooldown <= 0) {
          if (wasCooling) {
            // advance to next pair
            textIndex = (textIndex + 1) % texts.length;
            elA.textContent = texts[textIndex % texts.length];
            elB.textContent = texts[(textIndex + 1) % texts.length];
          }
          morph -= cooldown; // cooldown is negative, so this adds the overshoot
          cooldown = 0;

          var fraction = morph / MORPH_TIME;
          if (fraction >= 1) {
            cooldown = COOLDOWN_TIME;
            fraction = 1;
          }
          setMorph(fraction);
        } else {
          doCooldown();
        }
      }

      requestAnimationFrame(animate);
    })();
  </script>
