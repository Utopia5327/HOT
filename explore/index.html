<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Explore in 3D — Manas Bhatia</title>
  <meta name="description" content="Walk through Manas Bhatia’s hillside gallery of computational design, architecture and art. Open any exhibit to explore the original project.">
  <link rel="canonical" href="https://manasbhatia.com/explore/">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||'light';}catch{}</script>
  <link rel="stylesheet" href="./entry.css">
  <script src="../js/theme.js" defer></script>
  <script type="module" src="./entry.js"></script>
</head>
<body>
  <div id="site-header"></div>
  <main id="gallery-shell" aria-label="Spatial portfolio">
    <section id="gallery-entry" aria-labelledby="entry-title">
      <p class="entry-eyebrow">MANAS BHATIA / SPATIAL PORTFOLIO</p>
      <h1 id="entry-title">Explore in 3D.</h1>
      <div id="entry-loader" class="entry-loader" role="progressbar" aria-label="Loading the 3D gallery" hidden>
        <span class="loading-ring" aria-hidden="true"></span>
        <span class="loading-track" aria-hidden="true"></span>
        <span class="loading-caption" aria-hidden="true">Please wait</span>
      </div>
      <p id="entry-message" role="status" aria-live="polite">Walk through the gallery or browse the project pages.</p>
      <div class="entry-actions">
        <a id="browse-projects" href="../Computational%20Design.html">Browse projects <span aria-hidden="true">↗</span></a>
        <button id="launch-gallery" type="button" hidden>Open 3D anyway <span aria-hidden="true">↗</span></button>
      </div>
      <noscript><p>The interactive gallery needs JavaScript. All projects are available through the project index above.</p></noscript>
    </section>
  </main>
</body>
</html>
