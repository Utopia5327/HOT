<style>
@font-face {

@font-face {

:root {
    --bg-primary: #fafafa;
    --bg-secondary: #ffffff;
    --bg-tertiary: rgba(240, 240, 240, 0.85);
    --bg-tertiary-hover: rgba(230, 230, 230, 1);

    --text-secondary: #444;
    --text-tertiary: #3e3e3e;
    --border-color: rgba(200, 200, 200, 0.25);
    --shadow-color: rgba(0, 0, 0, 0.06);
    --shadow-hover: rgba(0, 0, 0, 0.12);
    --dropdown-bg: rgba(240, 240, 240, 0.95);
    --dropdown-hover: rgba(220, 220, 220, 1);
    --canvas-bg: rgb(252, 250, 245);
    --hamburger-bg: rgba(250, 250, 250, 0.98);
    --hamburger-overlay: rgba(0, 0, 0, 0.5);
}

[data-theme="dark"] {
    --bg-primary: #1a1a1a;
    --bg-secondary: #2d2d2d;
    --bg-tertiary: rgba(50, 50, 50, 0.85);
    --bg-tertiary-hover: rgba(70, 70, 70, 1);
    --text-primary: #ffffff;
    --text-secondary: #cccccc;
    --text-tertiary: #e0e0e0;
    --border-color: rgba(80, 80, 80, 0.35);
    --shadow-color: rgba(0, 0, 0, 0.25);
    --shadow-hover: rgba(0, 0, 0, 0.4);
    --dropdown-bg: rgba(60, 60, 60, 0.95);
    --dropdown-hover: rgba(80, 80, 80, 1);
    --canvas-bg: rgb(26, 26, 26);
    --hamburger-bg: rgba(24, 24, 24, 0.98);
    --hamburger-overlay: rgba(0, 0, 0, 0.7);
}

/* ── Navbar wrapper (invisible full-width fixed container) ── */
.minimal-navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 0;
    z-index: 1000;
    pointer-events: none;
}

/* ── MB Logo ── */
.minimal-logo {
    position: absolute;
    top: 20px;
    left: 20px;
    pointer-events: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 68px;
    height: 44px;
    border-radius: 10px;
    background: var(--bg-tertiary);
    backdrop-filter: blur(12px);
    font-family: 'Fira Mono', 'Courier New', monospace;
    font-size: var(--type-label, 0.75rem);
    font-weight: 400;
    color: var(--text-primary);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-decoration: none;
    box-shadow: 0 2px 16px 0 var(--shadow-color);
    border: 1px solid var(--border-color);
    transition: width 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                background 0.2s, box-shadow 0.2s, transform 0.2s;
    overflow: hidden;
    white-space: nowrap;
}
.minimal-logo:hover {
    width: 200px;
    background: var(--bg-tertiary-hover);
    box-shadow: 0 6px 24px 0 var(--shadow-hover);
    transform: translateY(-1px);
}
.logo-acronym,
.logo-fullname {
    padding: 0 12px;
    line-height: 44px;
    position: absolute;
    left: 0;
    right: 0;
    text-align: center;
    transition: opacity 0.3s ease;
}
.logo-fullname { opacity: 0; }
.minimal-logo:hover .logo-acronym { opacity: 0; }
.minimal-logo:hover .logo-fullname { opacity: 1; }

/* ================================================================
   FLUID CIRCULAR DOCK
   ================================================================ */
.fluid-dock {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 52px;
    height: 52px;
    pointer-events: auto;
    /* z-index ensures dock items sit above the backdrop within this stacking context */
    z-index: 1001;
}

/* All dock items share this base style */
.dock-item {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--bg-tertiary);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border-color);
    box-shadow: 0 4px 20px 0 var(--shadow-color);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-primary);
    cursor: pointer;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}
.dock-item:hover {
    background: var(--bg-tertiary-hover);
    box-shadow: 0 6px 24px 0 var(--shadow-hover);
}
.dock-item svg { display: block; }

/* ── Toggle button (item 1, always visible) ── */
.dock-toggle {
    position: relative;
    z-index: 52;
    transition: background 0.2s, box-shadow 0.2s, transform 0.15s;
    border: none;
    outline: none;
}
.dock-toggle:active { transform: scale(0.94); }

.dock-toggle-icon {
    position: relative;
    width: 20px;
    height: 20px;
}
.icon-burger,
.icon-x {
    position: absolute;
    top: 0;
    left: 0;
    transition: opacity 0.25s ease, transform 0.25s ease;
    transform-origin: center;
}
.icon-x {
    opacity: 0;
    transform: rotate(-90deg) scale(0.5);
}
/* When expanded: swap icons */
.fluid-dock[data-expanded="true"] .icon-burger {
    opacity: 0;
    transform: rotate(90deg) scale(0.5);
}
.fluid-dock[data-expanded="true"] .icon-x {
    opacity: 1;
    transform: rotate(0deg) scale(1);
}

/* ── Permanent theme button (sits left of the dock) ── */
.theme-btn {
    position: absolute;
    top: 20px;
    right: 80px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--bg-tertiary);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border-color);
    box-shadow: 0 4px 20px 0 var(--shadow-color);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-primary);
    cursor: pointer;
    pointer-events: auto;
    transition: background 0.2s, box-shadow 0.2s;
}
.theme-btn:hover {
    background: var(--bg-tertiary-hover);
    box-shadow: 0 6px 24px 0 var(--shadow-hover);
}

/* ── Secondary items (nav items, revealed on expand) ── */
.dock-secondary {
    position: absolute;
    top: 0;
    left: 0;
    opacity: 0;
    transform: translateY(0px);
    pointer-events: none;
    will-change: transform, opacity;
    transition:
        transform 300ms cubic-bezier(0.4, 0, 0.2, 1),
        opacity   300ms cubic-bezier(0.4, 0, 0.2, 1),
        background 0.2s,
        box-shadow 0.2s;
    border: none;
    outline: none;
}
/* Stagger delays for closing (fastest last = cascade up) */
.dock-secondary[data-dock-index="0"] { z-index: 55; transition-delay: 120ms, 120ms, 0ms, 0ms; }
.dock-secondary[data-dock-index="1"] { z-index: 54; transition-delay:  90ms,  90ms, 0ms, 0ms; }
.dock-secondary[data-dock-index="2"] { z-index: 53; transition-delay:  60ms,  60ms, 0ms, 0ms; }
.dock-secondary[data-dock-index="3"] { z-index: 52; transition-delay:  30ms,  30ms, 0ms, 0ms; }
.dock-secondary[data-dock-index="4"] { z-index: 51; transition-delay:   0ms,   0ms, 0ms, 0ms; }

/* Expanded state */
.fluid-dock[data-expanded="true"] .dock-secondary {
    opacity: 1;
    pointer-events: auto;
}
.fluid-dock[data-expanded="true"] .dock-secondary[data-dock-index="0"] { transform: translateY(60px);  transition-delay:   0ms,   0ms, 0ms, 0ms; }
.fluid-dock[data-expanded="true"] .dock-secondary[data-dock-index="1"] { transform: translateY(120px); transition-delay:  30ms,  30ms, 0ms, 0ms; }
.fluid-dock[data-expanded="true"] .dock-secondary[data-dock-index="2"] { transform: translateY(180px); transition-delay:  60ms,  60ms, 0ms, 0ms; }
.fluid-dock[data-expanded="true"] .dock-secondary[data-dock-index="3"] { transform: translateY(240px); transition-delay:  90ms,  90ms, 0ms, 0ms; }
.fluid-dock[data-expanded="true"] .dock-secondary[data-dock-index="4"] { transform: translateY(300px); transition-delay: 120ms, 120ms, 0ms, 0ms; }

/* ── Dark mode icon swap ── */
.dock-moon,
.dock-sun {
    display: flex;
    align-items: center;
    justify-content: center;
    position: absolute;
    transition: opacity 0.3s ease, transform 0.3s ease;
}
.dock-sun {
    opacity: 0;
    transform: scale(0.6) rotate(90deg);
}
[data-theme="dark"] .dock-moon {
    opacity: 0;
    transform: scale(0.6) rotate(-90deg);
}
[data-theme="dark"] .dock-sun {
    opacity: 1;
    transform: scale(1) rotate(0deg);
}

/* ── Labels: slide in to the left of each secondary item ── */
.dock-label {
    position: absolute;
    right: calc(100% + 10px);
    top: 50%;
    transform: translateY(-50%) translateX(6px);
    white-space: nowrap;
    font-family: 'Fira Mono', 'Courier New', monospace;
    font-size: var(--type-tag, 0.62rem);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-primary);
    background: var(--bg-tertiary);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border-color);
    box-shadow: 0 2px 12px 0 var(--shadow-color);
    padding: 0.3rem 0.65rem;
    border-radius: 6px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
}
.fluid-dock[data-expanded="true"] .dock-secondary[data-dock-index="0"] .dock-label { opacity: 1; transform: translateY(-50%) translateX(0); transition-delay:  30ms; }
.fluid-dock[data-expanded="true"] .dock-secondary[data-dock-index="1"] .dock-label { opacity: 1; transform: translateY(-50%) translateX(0); transition-delay:  60ms; }
.fluid-dock[data-expanded="true"] .dock-secondary[data-dock-index="2"] .dock-label { opacity: 1; transform: translateY(-50%) translateX(0); transition-delay:  90ms; }
.fluid-dock[data-expanded="true"] .dock-secondary[data-dock-index="3"] .dock-label { opacity: 1; transform: translateY(-50%) translateX(0); transition-delay: 120ms; }
.fluid-dock[data-expanded="true"] .dock-secondary[data-dock-index="4"] .dock-label { opacity: 1; transform: translateY(-50%) translateX(0); transition-delay: 150ms; }

/* ── (sidebar removed — nav is now entirely in the dock) ── */

/* ── Mobile ── */
@media (max-width: 700px) {
    .minimal-logo {
        top: 14px;
        left: 14px;
        width: 56px;
        height: 38px;
        font-size: var(--type-tag, 0.62rem);
    }
    .minimal-logo:hover { width: 160px; }
    .logo-acronym, .logo-fullname { line-height: 38px; padding: 0 8px; }
    .fluid-dock { top: 14px; right: 14px; }
    .theme-btn { top: 14px; right: 74px; width: 44px; height: 44px; }
    .hamburger-content { max-width: 100%; }
}
</style>
<script>
/* ── Dock toggle ── */
window.toggleDock = function() {
    const dock = document.getElementById('fluidDock');
    const backdrop = document.getElementById('dockBackdrop');
    const isExpanded = dock.getAttribute('data-expanded') === 'true';
    dock.setAttribute('data-expanded', String(!isExpanded));
    if (backdrop) backdrop.classList.toggle('active', !isExpanded);
};

window.closeDock = function() {
    const dock = document.getElementById('fluidDock');
    const backdrop = document.getElementById('dockBackdrop');
    if (dock) dock.setAttribute('data-expanded', 'false');
    if (backdrop) backdrop.classList.remove('active');
};

document.addEventListener('DOMContentLoaded', function() {
    if (typeof initializeTheme === 'function') initializeTheme();
});

/* ── Close dock when clicking outside ── */
document.addEventListener('click', function(e) {
    var dock = document.getElementById('fluidDock');
    if (dock && dock.getAttribute('data-expanded') === 'true' && !dock.contains(e.target)) {
        window.closeDock();
    }
});

/* ── Escape key closes dock ── */
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') window.closeDock();
});
</script>
