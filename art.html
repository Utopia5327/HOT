<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art - Manas Bhatia</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #ffffff;
            --bg-tertiary: rgba(240, 240, 240, 0.8);
            --bg-tertiary-hover: rgba(240, 240, 240, 1);
            --text-primary: #111;
            --text-secondary: #444;
            --text-tertiary: #3e3e3e;
            --border-color: rgba(200, 200, 200, 0.18);
            --shadow-color: rgba(0, 0, 0, 0.04);
            --shadow-hover: rgba(0, 0, 0, 0.08);
            --dropdown-bg: rgba(240, 240, 240, 0.95);
            --dropdown-hover: rgba(220, 220, 220, 1);
            --canvas-bg: rgb(255, 255, 255);
            --project-card-bg: #ffffff;
            --project-card-shadow: rgba(0,0,0,0.06);
            --project-card-shadow-hover: rgba(0,0,0,0.10);
        }

        [data-theme="dark"] {
            --bg-primary: #1a1a1a;
            --bg-secondary: #2d2d2d;
            --bg-tertiary: rgba(60, 60, 60, 0.8);
            --bg-tertiary-hover: rgba(60, 60, 60, 1);
            --text-primary: #ffffff;
            --text-secondary: #cccccc;
            --text-tertiary: #e0e0e0;
            --border-color: rgba(80, 80, 80, 0.3);
            --shadow-color: rgba(0, 0, 0, 0.2);
            --shadow-hover: rgba(0, 0, 0, 0.3);
            --dropdown-bg: rgba(60, 60, 60, 0.95);
            --dropdown-hover: rgba(80, 80, 80, 1);
            --canvas-bg: rgb(26, 26, 26);
            --project-card-bg: #2d2d2d;
            --project-card-shadow: rgba(0,0,0,0.2);
            --project-card-shadow-hover: rgba(0,0,0,0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            height: 100vh;
            overflow: hidden;
        }
        body {
            font-family: 'Inter', 'General Sans', Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: url('cursor.svg') 16 16, auto;
            transition: background 0.3s ease, color 0.3s ease;
        }
        body, html {
            cursor: url('cursor.svg') 16 16, auto;
        }
        .framer-sleek-navbar {
            position: fixed;
            top: 24px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 100;
            pointer-events: none;
        }
        .framer-sleek-nav-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 900px;
            background: rgba(17, 17, 17, 0.7);
            border-radius: 32px;
            box-shadow: 0 4px 32px 0 rgba(0,0,0,0.10);
            border: 1px solid rgba(255,255,255,0.10);
            backdrop-filter: blur(12px);
            padding: 0.5rem 2.2rem;
            pointer-events: auto;
        }
        [data-theme="dark"] .framer-sleek-nav-wrapper {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255,255,255,0.20);
        }
        .framer-sleek-logo {
            display: flex;
            align-items: center;
            width: 44px;
            height: 44px;
            border-radius: 16px;
            overflow: hidden;
            background: #232323;
            margin-right: 1.5rem;
        }
        [data-theme="dark"] .framer-sleek-logo {
            background: #404040;
        }
        .framer-sleek-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 16px;
        }
        .framer-sleek-links {
            display: flex;

        .framer-sleek-link {

            text-decoration: none;
            font-family: 'Inter', 'General Sans', Arial, sans-serif;

            letter-spacing: 0;

            border-radius: 12px;
            transition: background 0.2s, color 0.2s;
            display: flex;
            align-items: center;
        }
        .framer-sleek-link:hover, .framer-sleek-link.active {
            background: rgba(255,255,255,0.10);
            color: #a3e635;
        }
        .projects-section {
            max-width: 100vw;
            margin: 80px 0 0 0;
            padding: 0 3vw 90px 3vw;
        }
        .projects-header-row {
            display: flex;
            flex-direction: column;
            margin-bottom: 2.5vw;
        }
        .projects-title {
            font-family: 'Inter', 'General Sans', Arial, sans-serif;
            font-size: clamp(3.5rem, 5.5vw, 6rem);
            font-weight: 900;
            letter-spacing: -0.04em;
            line-height: 0.92;
            text-align: left;
            text-transform: uppercase;
            margin-bottom: 0.5vw;
            color: var(--text-primary);
            transition: color 0.3s ease;
        }
        .projects-description {
            font-family: 'Inter', 'General Sans', Arial, sans-serif;
            font-size: clamp(0.95rem, 1.1vw, 1.1rem);
            font-weight: 400;
            color: var(--text-secondary);
            max-width: 700px;
            margin-bottom: 2vw;

            text-align: left;
            letter-spacing: 0;
            align-self: flex-end;
            transition: color 0.3s ease;
        }
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2vw;
            width: 100%;
        }
        .framer-project-card {
            display: block;
            background: var(--project-card-bg);
            width: 100%;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            transition: box-shadow 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), background 0.3s ease;
            box-shadow: 0 2px 16px 0 var(--project-card-shadow);
            aspect-ratio: 1/1;
        }
        .framer-project-card:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 8px 32px 0 var(--project-card-shadow-hover);
            cursor: pointer;
        }
        .framer-image-container {
            position: absolute;
            inset: 0;
            border-radius: inherit;
        }
        .framer-image-shadow {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .framer-image-shadow img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            border-radius: inherit;
        }
        .framer-arrow-icon {
            display: none;
        }
        @media (max-width: 1200px) {
            .projects-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 700px) {
            .projects-grid {
                grid-template-columns: 1fr;
            }
            .framer-sleek-nav-wrapper {
                flex-direction: row;
                padding: 0.5rem 1rem;
                max-width: 98vw;
            }
            .projects-section {
                margin-top: 60px;
                padding-bottom: 70px;
            }
            .projects-title {
                font-size: 10vw;
            }
            .framer-sleek-links {
                gap: 1rem;
            }
        }
        @media (max-width: 900px) {
            .projects-description {
                align-self: stretch;
            }
        }
        #mycelium-canvas {
            position: fixed !important;
            top: 0;
            left: 0;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 0 !important;
            pointer-events: none;
        }
        .framer-sleek-navbar, .projects-section {
            position: relative;
            z-index: 1;
        }
        .project-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to top,
                rgba(0,0,0,0.92) 0%,
                rgba(0,0,0,0.6) 45%,
                rgba(0,0,0,0.0) 100%
            );
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-start;
            opacity: 0;
            transition: opacity 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            padding: 1.5rem;
            text-align: left;
            color: white;
        }
        .framer-project-card:hover .project-overlay {
            opacity: 1;
        }
        .project-index {
            font-family: 'Fira Mono', 'Courier New', monospace;
            font-size: 0.62rem;
            font-weight: 400;
            letter-spacing: 0.12em;
            opacity: 0.5;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            line-height: 1.5;
        }
        .project-title {
            font-family: 'Inter', 'General Sans', Arial, sans-serif;
            font-size: clamp(1rem, 1.5vw, 1.4rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1;
            margin-bottom: 0.5rem;
        }
        .project-details {
            font-family: 'Fira Mono', 'Courier New', monospace;
            font-size: 0.62rem;
            font-weight: 400;
            letter-spacing: 0.12em;
            opacity: 0.75;
            text-transform: uppercase;
            line-height: 1.5;
            margin-bottom: 0.75rem;
        }
        .project-tools {
            font-family: 'Fira Mono', 'Courier New', monospace;
            font-size: 0.58rem;
            font-weight: 400;
            letter-spacing: 0.18em;
            opacity: 0.5;
            text-transform: uppercase;
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 0.5rem;
            width: 100%;
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* ── Circular Gallery ───────────────────────────────────── */
        .gallery-main { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; z-index: 1; }
        .gallery-top { flex-shrink: 0; padding: 5.5rem 5vw 3rem; display: flex; flex-direction: column; align-items: flex-start; gap: 0.75rem; }
        .gallery-top h1 { font-family: 'Inter', 'General Sans', Arial, sans-serif; font-size: clamp(1.6rem, 2.5vw, 2.4rem); font-weight: 600; letter-spacing: -0.02em; line-height: 1; color: var(--text-primary); text-transform: uppercase; }
        .gallery-description { font-family: 'Inter', 'General Sans', Arial, sans-serif; font-size: clamp(0.95rem, 1.1vw, 1.1rem); font-weight: 400; color: var(--text-secondary); max-width: 560px; line-height: 1.75; letter-spacing: 0; opacity: 0.85; }
        .gallery-stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; perspective: 1400px; position: relative; }
        .gallery-ring { position: relative; width: 0; height: 0; transform-style: preserve-3d; }
        .gallery-card { position: absolute; width: 460px; height: 460px; margin-left: -230px; margin-top: -230px; border-radius: 14px; overflow: hidden; text-decoration: none; display: block; box-shadow: 0 24px 72px rgba(0,0,0,0.45); cursor: pointer; }
        .gallery-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; display: block; }
        .gallery-card:hover img { transform: scale(1.05); }
        .gallery-card-info { position: absolute; inset: 0; padding: 2rem 1.2rem 1.2rem; background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.6) 45%, rgba(0,0,0,0) 100%); color: #fff; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start; opacity: 0; transition: opacity 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94); pointer-events: none; }
        .gallery-card:hover .gallery-card-info { opacity: 1; }
        .gallery-card-index { font-family: 'Fira Mono', 'Courier New', monospace; font-size: 0.58rem; font-weight: 400; letter-spacing: 0.18em; opacity: 0.55; margin-bottom: 0.4rem; line-height: 1.5; }
        .gallery-card-title { font-family: 'Inter', 'General Sans', Arial, sans-serif; font-size: 1rem; font-weight: 700; line-height: 1; letter-spacing: -0.02em; margin-bottom: 0.35rem; }
        .gallery-card-type { font-family: 'Fira Mono', 'Courier New', monospace; font-size: 0.58rem; font-weight: 400; letter-spacing: 0.18em; opacity: 0.7; line-height: 1.5; }
        .scroll-hint { flex-shrink: 0; align-self: center; margin-bottom: 1.4rem; display: flex; flex-direction: row; align-items: center; gap: 0.55rem; pointer-events: none; z-index: 10; opacity: 0; background: rgba(128,128,128,0.15); backdrop-filter: blur(6px); border: 1px solid rgba(128,128,128,0.2); border-radius: 20px; padding: 0.45rem 0.9rem; animation: scroll-hint-in 0.9s ease-out 1.5s forwards; }
        .scroll-hint svg { width: 16px; height: 22px; color: var(--text-primary); opacity: 0.7; flex-shrink: 0; }
        .scroll-hint-wheel { animation: scroll-wheel 1.5s ease-in-out infinite; transform-origin: center; }
        .scroll-hint span { font-family: 'Fira Mono', 'Courier New', monospace; font-size: 0.58rem; font-weight: 400; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-primary); opacity: 0.65; white-space: nowrap; line-height: 1.5; }
        @keyframes scroll-hint-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes scroll-wheel { 0%, 100% { transform: translateY(0); opacity: 1; } 50% { transform: translateY(3px); opacity: 0.3; } }
    </style>
</head>
<body>
    <div id="site-header"></div>
    <div class="gallery-main">
        <div class="gallery-top">
            <h1>Art</h1>
            <p class="gallery-description">Exploring the intersection of art, architecture, and digital expression — creative experimentation with generative AI, digital media, and artistic installations that push the boundaries of design and spatial experience.</p>
        </div>
        <div class="gallery-stage">
            <div class="gallery-ring" id="galleryRing"></div>
        </div>
        <div class="scroll-hint">
            <svg viewBox="0 0 18 26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                <rect x="1" y="1" width="16" height="24" rx="8"/>
                <line class="scroll-hint-wheel" x1="9" y1="6" x2="9" y2="10"/>
            </svg>
            <span>Scroll to rotate</span>
        </div>
    </div>
    <div id="site-footer"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.min.js"></script>
    <script src="sketch-projects.js"></script>
    <script src="js/theme.js"></script>
    <script>
    function includeHTML(id, url) {
      fetch(url)
        .then(res => res.text())
        .then(html => { 
          document.getElementById(id).innerHTML = html; 
          
          // Execute scripts after HTML is loaded
          const scripts = document.getElementById(id).getElementsByTagName('script');
          for (let script of scripts) {
            if (script.src) {
              // For external scripts, create a new script element
              const newScript = document.createElement('script');
              newScript.src = script.src;
              document.head.appendChild(newScript);
            } else {
              // For inline scripts, execute them
              eval(script.innerHTML);
            }
          }
          
          // Re-initialize theme after header is loaded to ensure toggle button works
          if (id === 'site-header') {
            if (typeof initializeTheme === 'function') {
              initializeTheme();
            }
            // Attach overlay click-to-close handler for hamburger menu
            var overlay = document.getElementById('hamburgerOverlay');
            if (overlay) {
              overlay.addEventListener('click', function(e) {
                if (e.target === overlay) {
                  window.toggleHamburgerMenu();
                }
              });
            }
          }
        });
    }
    includeHTML('site-header', 'header.html');
    includeHTML('site-footer', 'footer.html');
    </script>
    <script>
        let spacing = 28;   // Spacing for clear lines
        let time = 0;

        function setup() {
            createCanvas(windowWidth, windowHeight);
            pixelDensity(1);
            noFill();
            frameRate(60);
        }

        function draw() {
            // Use CSS variable for background color
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const bgColor = isDark ? color(26, 26, 26) : color(255, 255, 255);
            background(bgColor);
            
            time += 0.003;

            // Draw dipole field dotted lines
            for (let x = 0; x < width; x += spacing) {
                for (let y = 0; y < height; y += spacing) {
                    let dx = x - mouseX;
                    let dy = y - mouseY;
                    let r = sqrt(dx * dx + dy * dy) + 0.001; // Avoid div by zero
                    let theta = atan2(dy, dx);

                    // Dipole field direction (tangent to circles around the cursor)
                    let angle = theta + PI/2;

                    // Fade with distance - adjust colors based on theme
                    let alpha = map(r, 0, width/2, 100, 20);
                    if (isDark) {
                        stroke(200, 200, 200, alpha);  // Much whiter for dark mode
                    } else {
                        stroke(100, 100, 100, alpha);  // Original gray for light mode
                    }
                    strokeWeight(1);  // Thinner lines

                    // Shorter line length
                    let len = map(r, 0, width/2, spacing * 0.8, spacing * 0.4);

                    // More dotted: smaller dash and gap
                    let dashLength = 2;
                    let gapLength = 2;
                    let numDashes = Math.floor(len / (dashLength + gapLength));

                    push();
                    translate(x, y);
                    rotate(angle);
                    for (let i = 0; i < numDashes; i++) {
                        let start = i * (dashLength + gapLength);
                        let end = start + dashLength;
                        if (end > len) end = len;
                        line(start, 0, end, 0);
                    }
                    pop();
                }
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }

        // Listen for theme changes
        window.addEventListener('themeChange', function(e) {
            // Redraw canvas with new theme
            draw();
        });
    </script>
    <script>
    /* ── Coverflow Gallery ── */
    (function() {
        var ARTWORKS = [
            { idx:'01/05', title:'Google UnFold: New Worlds of Fashion', type:'Generative AI · Fashion Design · 2023', img:'img/unfoldthumb1.jpg',             href:'./art/art1.html' },
            { idx:'02/05', title:'Les Lieux Imaginaires',                type:'Generative AI Art · Exhibition · 2024',  img:'img/Chateauart/chateauthumb.jpg', href:'./art/art2.html' },
            { idx:'03/05', title:'AI x Future Cities',                   type:'Speculative Design · Urban Fiction · 2023', img:'img/Future Cities copy.jpg',   href:'./art/art3.html' },
            { idx:'04/05', title:'Symbiotic Architecture',               type:'Speculative Architecture · AI · 2022',   img:'img/symbiotic.jpg',              href:'./art/art4.html' },
            { idx:'05/05', title:'Reimagining India',                    type:'Urban Design · Speculative · 2023',      img:'img/reimagineindiathumb.png',     href:'./art/art5.html' }
        ];

        var ring = document.getElementById('galleryRing');
        var n = ARTWORKS.length;
        var pos = 0;
        var isPaused = false;
        var AUTO_SPEED = 0.002;
        var cards = [];

        ARTWORKS.forEach(function(p, i) {
            var card = document.createElement('a');
            card.href = p.href;
            card.className = 'gallery-card';
            card.innerHTML =
                '<img src="' + p.img + '" alt="' + p.title + '" loading="lazy">' +
                '<div class="gallery-card-info">' +
                    '<p class="gallery-card-index">' + p.idx + '</p>' +
                    '<h2 class="gallery-card-title">' + p.title + '</h2>' +
                    '<p class="gallery-card-type">' + p.type + '</p>' +
                '</div>';
            card.addEventListener('mouseenter', function() { isPaused = true; });
            card.addEventListener('mouseleave', function() { isPaused = false; });
            card.addEventListener('click', function(e) {
                var off = i - pos;
                while (off > n / 2) off -= n;
                while (off < -n / 2) off += n;
                if (Math.abs(off) > 0.45) { e.preventDefault(); pos += off; }
            });
            ring.appendChild(card);
            cards.push(card);
        });

        function render() {
            cards.forEach(function(card, i) {
                var off = i - pos;
                while (off > n / 2) off -= n;
                while (off < -n / 2) off += n;
                var abs = Math.abs(off);
                var tx = off * 420;
                var tz = -(abs * 60);
                var ry = off * -25;
                var scale = Math.max(0.5, 1 - abs * 0.2);
                var opacity = Math.max(0, 1 - abs * 0.38);
                card.style.transform = 'translateX(' + tx + 'px) translateZ(' + tz + 'px) rotateY(' + ry + 'deg) scale(' + scale + ')';
                card.style.opacity = opacity;
                card.style.zIndex = Math.round(100 - abs * 10);
                card.style.pointerEvents = opacity > 0.05 ? 'auto' : 'none';
            });
        }

        function animate() {
            if (!isPaused) pos += AUTO_SPEED;
            render();
            requestAnimationFrame(animate);
        }

        window.addEventListener('wheel', function(e) {
            e.preventDefault();
            pos += e.deltaY * 0.004;
        }, { passive: false });

        var ty0 = 0;
        window.addEventListener('touchstart', function(e) { ty0 = e.touches[0].clientY; }, { passive: true });
        window.addEventListener('touchmove', function(e) {
            e.preventDefault();
            pos += (ty0 - e.touches[0].clientY) * 0.006;
            ty0 = e.touches[0].clientY;
        }, { passive: false });

        animate();
    })();
    </script>
